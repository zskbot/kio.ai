services:
  web:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
    ports:
      - "3000:8080"
    command: sh -c "pip install --no-cache-dir aiohttp watchfiles && watchfiles \"python server.py\" /app"
    stop_grace_period: 2s
